<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senox — Studio Omniscient</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060a;--pn:rgba(18,18,28,.78);--fg:#e6e6ea;--mut:#8a8a98;--ln:rgba(255,255,255,.09);--hv:rgba(255,255,255,.06);--ac:#8b5cf6;--c2:#06b6d4;--c3:#ec4899;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f3f9;--pn:rgba(255,255,255,.85);--fg:#17171b;--mut:#6a6a78;--ln:rgba(0,0,0,.1);--hv:rgba(0,0,0,.05)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]):not([data-theme=light]){--bg:#f3f3f9;--pn:rgba(255,255,255,.85);--fg:#17171b;--mut:#6a6a78;--ln:rgba(0,0,0,.1);--hv:rgba(0,0,0,.05)}}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.6 Inter,system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s}button:active{transform:scale(.95)}
svg{flex:none;display:block}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#glow{position:fixed;top:0;left:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 65%);opacity:.14;pointer-events:none;z-index:70;will-change:transform}
.disp{font-family:'Instrument Serif',serif;font-weight:400}
.gt{background:linear-gradient(90deg,var(--ac),var(--c2),var(--c3),var(--ac));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:-300% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.25)}}@keyframes halo{50%{box-shadow:0 0 34px 2px var(--ac)}}
/* splash */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .7s,transform .7s,visibility .7s}
#splash.out{opacity:0;transform:scale(1.12);visibility:hidden}
.core{position:relative;width:120px;height:120px;margin:0 auto 26px}.core i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--ac);animation:spin 1.6s linear infinite}
.core i:nth-child(2){inset:12px;border-top-color:var(--c2);animation-duration:2.2s;animation-direction:reverse}.core i:nth-child(3){inset:24px;border-top-color:var(--c3);animation-duration:1.2s}
.core b{position:absolute;inset:38px;border-radius:50%;background:conic-gradient(var(--ac),var(--c2),var(--c3),var(--ac));animation:spin 4s linear infinite,pulse 1.6s ease-in-out infinite;box-shadow:0 0 40px var(--ac)}
.word{font:400 58px 'Instrument Serif',serif;letter-spacing:.14em}.word span{display:inline-block;opacity:0;animation:let .7s forwards cubic-bezier(.2,1.5,.4,1)}
@keyframes let{from{opacity:0;transform:translateY(30px) rotateX(90deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.pbar{width:240px;height:3px;border-radius:9px;background:var(--hv);margin:18px auto 0;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--c2),var(--c3));animation:load 2.8s ease-out forwards}@keyframes load{to{width:100%}}
#sst{font:12px 'JetBrains Mono',monospace;color:var(--mut);margin-top:12px;min-height:18px}
/* auth */
#auth{position:fixed;inset:0;z-index:150;background:var(--bg);display:grid;place-items:center;padding:16px;clip-path:circle(150% at 50% 50%);transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
#auth.iris{clip-path:circle(0% at 50% 50%)}
.card{width:100%;max-width:400px;padding:28px;border-radius:24px;border:1px solid var(--ln);background:var(--pn);backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.4),0 0 70px -25px var(--ac);animation:zm .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes zm{from{opacity:0;transform:scale(.85) translateY(24px);filter:blur(10px)}}
.lg{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--c2));animation:halo 3s infinite;margin:0 auto 14px}
.card h1{font:400 34px 'Instrument Serif',serif;text-align:center}.card>p{text-align:center;color:var(--mut);margin:4px 0 18px;font-size:13px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:12px;background:var(--hv);padding:3px;margin-bottom:16px}
.tabs i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:10px;background:var(--ac);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}.tabs.s i{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;padding:8px;font-weight:500;transition:color .3s}.tabs button.on{color:#fff}
.fw{position:relative;margin-bottom:12px}.fw>svg{position:absolute;left:13px;top:13px;color:var(--mut)}
.fld{width:100%;padding:11px 40px 11px 40px;border-radius:12px;border:1px solid var(--ln);background:var(--hv);transition:border-color .3s,box-shadow .3s}
.fld:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent),0 0 26px -6px var(--ac)}
.fw.ok .fld{border-color:#10b981}.fw.bad .fld{border-color:#f43f5e}.fw .st{position:absolute;right:12px;top:12px;opacity:0;transform:scale(.4);transition:.35s cubic-bezier(.3,1.6,.5,1)}.fw.ok .st{opacity:1;transform:none;color:#10b981}
.hint{font-size:11px;color:#f43f5e;min-height:0;max-height:0;overflow:hidden;transition:max-height .3s;padding-left:4px}.fw.bad+.hint{max-height:20px}
.cf{max-height:0;overflow:hidden;opacity:0;transition:max-height .45s,opacity .45s}.s .cf,.cf.show{max-height:90px;opacity:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);width:100%;font-weight:500}.btn:hover{background:var(--hv)}
.pri{background:linear-gradient(120deg,var(--ac),var(--c2));color:#fff;border:0;position:relative;overflow:hidden}.pri:hover{background:linear-gradient(120deg,var(--ac),var(--c2));box-shadow:0 10px 30px -8px var(--ac);transform:translateY(-1px)}
.pri::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.5s infinite}@keyframes sheen{to{transform:translateX(100%)}}
.err{color:#f43f5e;font-size:12px;text-align:center;margin-top:10px;min-height:18px}.note{font-size:11px;color:var(--mut);text-align:center;margin-top:10px}
/* app */
#app{position:relative;z-index:1;display:flex;height:100%}
#side{width:292px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--pn);backdrop-filter:blur(18px);border-right:1px solid var(--ln);transition:transform .4s cubic-bezier(.2,.9,.3,1);animation:sin .7s both cubic-bezier(.2,.9,.3,1)}@keyframes sin{from{transform:translateX(-100%)}}
.sh{display:flex;align-items:center;gap:10px}.sh .lg{width:34px;height:34px;border-radius:11px;margin:0}.sh b{font:400 26px 'Instrument Serif',serif;flex:1;letter-spacing:.05em}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}.ib:hover{background:var(--hv);color:var(--fg)}#cl,#mn{display:none}
.sr{position:relative}.sr svg{position:absolute;left:11px;top:11px;color:var(--mut)}#q{width:100%;padding:9px 12px 9px 34px;border-radius:11px;border:1px solid var(--ln);background:var(--hv)}#q:focus{border-color:var(--ac)}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:2px 6px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:0 -4px;padding:0 4px}
.it{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;animation:fin .45s both cubic-bezier(.2,.9,.3,1);color:var(--mut)}@keyframes fin{from{opacity:0;transform:translateX(-18px)}}
.it:hover{background:var(--hv);color:var(--fg)}.it.on{background:var(--hv);border-color:var(--ac);color:var(--fg);box-shadow:0 0 18px -8px var(--ac)}
.it .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.it .t.typed{display:block;width:0;animation:typing 1.1s steps(22) forwards;border-right:2px solid var(--ac);text-overflow:clip}@keyframes typing{to{width:100%;border-color:transparent}}
.shim{background:linear-gradient(90deg,var(--mut),var(--fg),var(--mut));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 1.4s linear infinite}
.it .ac{display:none;gap:1px}.it:hover .ac{display:flex}.it .ac button{padding:3px;border-radius:7px}.it .ac button:hover{background:var(--hv);color:var(--fg)}.it .ac .dg{color:#f43f5e;background:rgba(244,63,94,.15)}.it input{flex:1;min-width:0;border-bottom:1px solid var(--ac);color:var(--fg)}
.sf{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--ln);padding-top:12px}
.usr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--hv);cursor:pointer}.usr:hover{box-shadow:0 0 0 1px var(--ac)}
.av{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:600;background:var(--hv);border:1px solid var(--ln);position:relative}.ai .av{background:linear-gradient(135deg,var(--ac),var(--c2));color:#fff;border:0}
.usr .av{background:var(--ac);color:#fff;border:0}.usr .av::after{content:'';position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:#10b981;border:2px solid var(--bg);animation:pulse 2s infinite}
.usr small{display:block;color:var(--mut);font-size:11px;line-height:1.2}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--pn);backdrop-filter:blur(14px);position:relative;animation:hin .7s both cubic-bezier(.2,.9,.3,1)}@keyframes hin{from{transform:translateY(-100%)}}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),var(--c2),transparent);background-size:200%;animation:flow 4s linear infinite}
#ttl{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.pk{display:flex;gap:7px;align-items:center;padding:7px 12px;border-radius:999px;border:1px solid var(--ln);font-size:13px;max-width:230px}.pk span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pk:hover{border-color:var(--ac);box-shadow:0 0 18px -6px var(--ac)}
#msgs{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.row{display:flex;gap:12px;width:100%;max-width:780px;margin:0 auto;animation:up .55s both cubic-bezier(.2,.85,.25,1)}@keyframes up{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(6px)}}.row.us{flex-direction:row-reverse}
.ai.thk .av{animation:pulse2 1.2s ease-in-out infinite}@keyframes pulse2{50%{box-shadow:0 0 24px var(--ac);transform:scale(1.12)}}
.bb{min-width:0;max-width:calc(100% - 46px)}.tx{padding:11px 15px;border-radius:16px;border:1px solid var(--ln);background:var(--pn);overflow-wrap:anywhere;transition:box-shadow .3s}
.us .tx{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 80%,#000),color-mix(in srgb,var(--c2) 70%,#000));color:#fff;border:0}.tx:hover{box-shadow:0 0 0 1px var(--ac),0 0 22px -8px var(--ac)}
.tx p+p,.tx ul,.tx h4,.tx details{margin-top:8px}.tx ul{padding-left:20px;list-style:disc}.tx h4{font:400 20px 'Instrument Serif',serif}
.tx code{font:12px 'JetBrains Mono',monospace;background:var(--hv);padding:1px 5px;border-radius:5px}
.tx details{border-left:2px solid var(--ac);padding-left:10px;color:var(--mut);font-size:13px}.tx summary{cursor:pointer;color:var(--ac)}
.code{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid var(--ln);background:rgba(0,0,0,.45);color:#e6e6ea}.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font:11px 'JetBrains Mono',monospace;color:#a1a1aa;border-bottom:1px solid rgba(255,255,255,.08)}.ch div{display:flex;gap:10px}.ch button{display:flex;gap:4px;align-items:center}.ch button:hover{color:#fff}
pre{padding:12px;overflow-x:auto;font:12px/1.55 'JetBrains Mono',monospace}
.acts{display:flex;gap:2px;margin-top:4px;opacity:0;transition:opacity .2s;align-items:center}.row:hover .acts{opacity:1}.acts button{padding:5px;border-radius:8px;color:var(--mut)}.acts button:hover{background:var(--hv);color:var(--fg)}.acts small{color:var(--mut);font:11px 'JetBrains Mono',monospace;margin-left:6px}
.car::after{content:'▍';color:var(--ac);animation:bl .8s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.wave{display:flex;gap:3px;align-items:center;height:20px;color:var(--mut);font-size:12px}.wave i{width:3px;border-radius:2px;background:linear-gradient(var(--ac),var(--c2));animation:wv 1s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}.wave span{margin-left:8px}
@keyframes wv{0%,100%{height:4px}50%{height:18px}}
.wl{margin:auto;text-align:center;max-width:680px;padding:10px}.big{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--c2),var(--c3));background-size:200%;animation:float 4s ease-in-out infinite,flow 6s linear infinite,halo 3s infinite}@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
.wl h1{font:400 clamp(34px,6vw,54px)/1.1 'Instrument Serif',serif}.wl p{color:var(--mut);margin:10px 0 22px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.chip{text-align:left;padding:14px 15px;border-radius:14px;border:1px solid var(--ln);background:var(--pn);animation:fin .6s both;display:flex;flex-direction:column;gap:3px}
.chip:hover{border-color:var(--ac);box-shadow:0 12px 30px -12px var(--ac);transform:translateY(-5px)}.chip b{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ac)}.chip span{color:var(--mut);font-size:12px}
form{display:flex;gap:8px;align-items:flex-end;margin:0 auto 14px;padding:10px;width:calc(100% - 28px);max-width:780px;border-radius:20px;border:1px solid var(--ln);background:var(--pn);backdrop-filter:blur(16px);animation:fm .7s .2s both cubic-bezier(.2,.9,.3,1)}@keyframes fm{from{transform:translateY(100%);opacity:0}}
textarea{flex:1;resize:none;max-height:160px;padding:9px 10px;min-height:40px}form:focus-within{border-color:var(--ac);box-shadow:0 0 30px -10px var(--ac)}
.sb{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--c2));color:#fff;position:relative;overflow:hidden}.sb:hover{box-shadow:0 0 22px -2px var(--ac);transform:translateY(-2px)}
.mic{background:none;color:var(--mut);border:1px solid var(--ln)}.mic.on{background:rgba(239,68,68,.25);color:#f87171;animation:pulse2 1s infinite}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(3);opacity:0}}
/* artifacts */
#art{width:0;flex:none;overflow:hidden;background:var(--pn);backdrop-filter:blur(16px);border-left:0 solid var(--ln);transition:width .5s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}#art.open{width:min(46%,620px);border-left-width:1px}
#art .ah{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);min-width:300px}#art .ah b{flex:1;font-weight:500}#art iframe{flex:1;border:0;background:#fff;min-width:300px}
/* modal */
.md{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);padding:16px;animation:fd .25s}@keyframes fd{from{opacity:0}}
.bx{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px;border:1px solid var(--ln);background:var(--bg);padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.5),0 0 60px -20px var(--ac);animation:zm .45s cubic-bezier(.2,1.3,.4,1)}
.bx h2{font:400 28px 'Instrument Serif',serif;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec{margin:16px 0}.sec>div:first-child{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.f2{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--ln);background:var(--hv);margin-bottom:8px}.f2:focus{border-color:var(--ac)}
.swc{display:flex;gap:10px;flex-wrap:wrap}.swc button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.swc .on{border-color:var(--fg);transform:scale(1.15)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln)}.seg .on{border-color:var(--ac);background:var(--hv)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.sw2{width:44px;height:25px;border-radius:99px;background:var(--hv);border:1px solid var(--ln);position:relative}.sw2::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--mut);transition:.3s cubic-bezier(.3,1.5,.5,1)}.sw2.on{background:var(--ac)}.sw2.on::after{left:21px;background:#fff}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stt div{padding:10px;border-radius:12px;background:var(--hv);text-align:center}.stt b{display:block;font:400 24px 'Instrument Serif',serif}.stt small{color:var(--mut)}
.gl{color:var(--ac);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px;display:flex;gap:7px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc{text-align:left;padding:9px 11px;border-radius:12px;border:1px solid var(--ln);animation:fin .4s both}.pc:hover,.pc.on{border-color:var(--ac);background:var(--hv)}.pc small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
.tst{position:fixed;left:50%;bottom:96px;z-index:300;padding:8px 16px;border-radius:99px;background:var(--pn);backdrop-filter:blur(12px);border:1px solid var(--ac);font-size:12px;animation:ts 2.4s forwards;pointer-events:none}@keyframes ts{0%{opacity:0;transform:translate(-50%,20px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:9px}
@media(max-width:800px){#side{position:fixed;z-index:50;inset:0 auto 0 0;height:100%;transform:translateX(-102%);width:min(310px,88vw);padding-top:calc(14px + env(safe-area-inset-top,0px))}#side.open{transform:none}#cl,#mn{display:grid}.it .ac{display:flex}#art.open{position:fixed;inset:0;width:100%;z-index:80}#glow{display:none}.grid{grid-template-columns:1fr}}
.nofx *{animation-duration:.01s!important}#glow.off{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.word span{opacity:1}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="glow"></div>
<div id="splash"><div><div class="core"><i></i><i></i><i></i><b></b></div><div class="word" id="wd"></div><div class="pbar"><i></i></div><div id="sst"></div></div></div>
<div id="auth" style="display:none"><div class="card" id="card">
 <div class="lg" data-ic="spark" data-s="22"></div><h1 id="at">Content de te revoir</h1><p id="as">Connecte-toi pour retrouver Senox.</p>
 <div class="tabs" id="tabs"><i></i><button class="on" data-m="in">Se connecter</button><button data-m="up">Créer un compte</button></div>
 <div class="fw" id="f1"><span data-ic="mail" data-s="17"></span><input class="fld" id="em" type="email" placeholder="adresse@gmail.com" autocomplete="email"><span class="st" data-ic="check" data-s="17"></span></div><div class="hint" id="h1">Utilise une adresse Gmail valide (@gmail.com).</div>
